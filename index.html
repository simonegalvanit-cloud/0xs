<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0xAccess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --void:#040308;
  --dusk:#120b22;
  --bruise:#2a1a4a;
  --violet:#8a5cff;
  --lilac:#d8ccff;
  --dim:#8a7fb0;
  --blood:#ff4d6d;
  --px:4px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#040308; } }
:root[data-theme="dark"]{ --void:#040308; }
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--lilac);
  font-family:"VT323","Courier New",monospace;font-size:22px;line-height:1.35;
  -webkit-font-smoothing:none;font-smooth:never;
}
body::after{ /* scanlines */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 4px);
}
.dither{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;image-rendering:pixelated;background-size:8px 8px}
main,header,footer{position:relative;z-index:1}
a{color:var(--lilac)}
a:hover{color:var(--violet)}
:focus-visible{outline:var(--px) solid var(--violet);outline-offset:var(--px)}
h1,h2,h3{font-family:"Pixelify Sans","VT323",monospace;font-weight:700;margin:0;line-height:1}
p{margin:0;max-width:34em}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}

/* pixel frame: stepped corners */
.frame{
  position:relative;background:var(--dusk);
  box-shadow:
    0 calc(var(--px)*-1) 0 0 var(--bruise),
    0 var(--px) 0 0 var(--bruise),
    calc(var(--px)*-1) 0 0 0 var(--bruise),
    var(--px) 0 0 0 var(--bruise);
}

/* header */
header{padding:24px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:"Pixelify Sans",monospace;font-size:24px}
.mark i{width:16px;height:16px;background:var(--violet);display:inline-block;box-shadow:4px 4px 0 var(--bruise)}
nav{display:flex;gap:28px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--dim)}
nav a:hover{color:var(--lilac)}

/* hero */
.hero{min-height:min(88vh,860px);display:flex;flex-direction:column;justify-content:center;gap:40px;padding:40px 0 80px}
#sigil{width:100%;height:clamp(140px,26vw,300px);display:block;image-rendering:pixelated;cursor:crosshair}
.hero-copy{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px;align-items:end}
.whisper{font-size:30px;color:var(--lilac)}
.whisper #typed{color:var(--dim);text-decoration:none}
.whisper #typed.live{color:var(--violet)}
.whisper #typed.live:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--violet);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;
  font-family:"Pixelify Sans",monospace;font-size:20px;text-decoration:none;cursor:pointer;
  background:var(--violet);color:var(--void);border:0;
  box-shadow:var(--px) var(--px) 0 0 var(--bruise);
  transition:transform .08s steps(2),box-shadow .08s steps(2);
}
.btn:hover{color:var(--void);transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--bruise)}
.btn:active{transform:translate(var(--px),var(--px));box-shadow:none}
.btn.ghost{background:transparent;color:var(--lilac);box-shadow:inset 0 0 0 var(--px) var(--bruise)}
.btn.ghost:hover{color:var(--violet);transform:none}
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}

section{padding:96px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
h2{font-size:clamp(40px,6vw,72px)}
.sub{color:var(--dim)}

/* access overlay */
.access{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center}
.access[hidden]{display:none}
#access-fx{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.access-msg{position:relative;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;transition:opacity .3s steps(4)}
.access-msg.on{opacity:1}
.access-kicker{color:var(--violet);letter-spacing:.1em}
.access-msg h2{font-size:clamp(36px,7vw,88px);min-height:1em}
.access-sub{color:var(--dim);font-size:26px;min-height:1.4em}
#access-close{margin-top:18px;opacity:0;pointer-events:none;transition:opacity .3s steps(3)}
#access-close.on{opacity:1;pointer-events:auto}
.shake{animation:shake .45s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(6px,-6px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,4px)}}

/* castle */
.castle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}
.castle-frame{aspect-ratio:692/771;width:100%;overflow:hidden}
#castle{width:100%;height:100%;display:block;image-rendering:pixelated}
.castle-copy{display:flex;flex-direction:column;gap:20px}
.castle-copy .sub{font-size:28px}

/* ticker */
.ticker{padding:48px 40px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.ticker-label,.ticker-rate{color:var(--dim)}
.ticker-num{
  font-family:"Pixelify Sans",monospace;font-weight:700;color:var(--violet);
  font-size:clamp(40px,10vw,140px);line-height:1;max-width:none;
  display:flex;align-items:flex-end;white-space:nowrap;
}
.ticker-num .sym{display:inline-block;height:1.2em;line-height:1.2em}
.ticker-num .col{
  display:inline-block;position:relative;height:1.2em;overflow:hidden;
  width:.62em;text-align:center;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%);
}
.ticker-num .strip{
  display:flex;flex-direction:column;will-change:transform;
  transition:transform .9s cubic-bezier(.16,1,.3,1);
}
.ticker-num .strip.snap{transition:none}
.ticker-num .strip span{display:block;height:1.2em;line-height:1.2em}
@media (prefers-reduced-motion:reduce){.ticker-num .strip{transition:none}}

/* request */
.request{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.note{color:var(--dim);margin-top:24px}
.warn{margin-top:24px;padding:16px 20px;color:var(--lilac)}
.warn strong{color:var(--blood);font-weight:400}
form{padding:36px;display:flex;flex-direction:column;gap:22px}
label{display:block;color:var(--dim);margin-bottom:8px}
input{
  width:100%;min-height:52px;padding:0 16px;background:var(--void);color:var(--lilac);
  font-family:"VT323",monospace;font-size:22px;border:0;
  box-shadow:inset 0 0 0 var(--px) var(--bruise);
}
input::placeholder{color:#5c5280}
input:focus{outline:none;box-shadow:inset 0 0 0 var(--px) var(--violet)}
.status{min-height:1.4em;color:var(--violet)}
.status.err{color:var(--blood)}

footer{padding:40px 0 56px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:var(--dim)}

@media (max-width:860px){
  .hero-copy,.request{grid-template-columns:minmax(0,1fr)}
  .actions{justify-content:flex-start}
  .ticker{padding:32px 20px}
  .castle{grid-template-columns:minmax(0,1fr);gap:32px}
  nav{gap:18px}
  body{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .cursor{animation:none}
}
</style>
</head>
<body>
<div class="dither" id="dither" aria-hidden="true"></div>

<header>
  <div class="wrap">
    <a class="mark" href="#top"><i></i>0xAccess</a>
    <nav aria-label="Main">
      <a href="#rules">The rules</a>
      <a href="#access" data-access>Request a key</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <canvas id="sigil" role="img" aria-label="The 0xAccess sigil, assembling out of static"></canvas>
    <div class="hero-copy">
      <p class="whisper">You weren't supposed to find this page.<br><a href="#access" data-access id="typed" aria-label="Request a key"><span id="typed-text" aria-hidden="true">But since you're here</span></a><span class="cursor" aria-hidden="true"></span></p>
      <div class="actions">
        <a class="btn ghost" href="#rules">Read the rules</a>
      </div>
    </div>
  </div>

  <section class="castle-sec">
    <div class="wrap castle">
      <div class="castle-frame frame">
        <canvas id="castle" role="img" aria-label="A lone figure looking up at a white castle floating in a dark sky"></canvas>
      </div>
      <div class="castle-copy">
        <h2>Everyone sees it.</h2>
        <p class="sub">Almost no one gets in.</p>
      </div>
    </div>
  </section>

  <section id="rules">
    <div class="wrap">
      <div class="head">
        <h2>There are no rules</h2>
        <p class="sub">Only results.</p>
      </div>
      <div class="ticker frame">
        <p class="ticker-label">Made by members, counting every second</p>
        <p class="ticker-num" id="ticker" aria-live="off">$0.00</p>
        <p class="ticker-rate" id="rate"></p>
      </div>
    </div>
  </section>

</main>

<div id="access" class="access" role="dialog" aria-modal="true" aria-labelledby="access-title" hidden>
  <canvas id="access-fx" aria-hidden="true"></canvas>
  <div class="access-msg">
    <p class="access-kicker" id="access-kicker"></p>
    <h2 id="access-title"><span id="access-line"></span><span class="cursor" aria-hidden="true"></span></h2>
    <p class="access-sub" id="access-sub"></p>
    <button class="btn ghost" id="access-close" type="button">Leave</button>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>0xAccess</span>
    <span>If you know, you know.</span>
    <span>[CONTACT]</span>
  </div>
</footer>

<script>
(function(){
  var css = getComputedStyle(document.documentElement);
  var VIOLET = css.getPropertyValue('--violet').trim() || '#8a5cff';
  var LILAC  = css.getPropertyValue('--lilac').trim()  || '#d8ccff';
  var BRUISE = css.getPropertyValue('--bruise').trim() || '#2a1a4a';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ordered-dither background tile */
  (function(){
    var c=document.createElement('canvas');c.width=c.height=4;var x=c.getContext('2d');
    var bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    for(var i=0;i<4;i++)for(var j=0;j<4;j++){ if(bayer[i][j]<2){x.fillStyle='#1a1030';x.fillRect(j,i,1,1);} }
    var d=document.getElementById('dither');
    d.style.backgroundImage='url('+c.toDataURL()+')';
  })();

  /* hero sigil: pixels assemble from static, scatter near the cursor */
  var cv=document.getElementById('sigil'),ctx=cv.getContext('2d');
  var pts=[],cell=6,W=0,H=0,mouse={x:-999,y:-999},t0=performance.now();
  function build(){
    var r=cv.getBoundingClientRect();W=Math.floor(r.width);H=Math.floor(r.height);
    cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
    var cols=Math.floor(W/cell),rows=Math.floor(H/cell);
    var o=document.createElement('canvas');o.width=cols;o.height=rows;var ox=o.getContext('2d');
    var fs=Math.floor(rows*0.78);
    ox.fillStyle='#fff';ox.textBaseline='middle';ox.textAlign='center';
    ox.font='700 '+fs+'px "Pixelify Sans", monospace';
    var w=ox.measureText('0xAccess').width;
    if(w>cols*0.96){fs=Math.floor(fs*cols*0.96/w);ox.font='700 '+fs+'px "Pixelify Sans", monospace';}
    ox.fillText('0xAccess',cols/2,rows/2+1);
    var data=ox.getImageData(0,0,cols,rows).data,old=pts;pts=[];
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      if(data[(y*cols+x)*4+3]>110){
        var p=old.length?old[pts.length%old.length]:null;
        pts.push({tx:x*cell,ty:y*cell,
          x:p?p.x:Math.random()*W, y:p?p.y:Math.random()*H,
          hot:Math.random()<0.08});
      }
    }
    if(reduce){pts.forEach(function(p){p.x=p.tx;p.y=p.ty;});}
  }
  function frame(now){
    ctx.clearRect(0,0,W,H);
    // static noise, fades after assembly
    var age=(now-t0)/1000,noise=reduce?0:Math.max(0.04,1-age/1.6);
    var n=Math.floor((W*H)/(cell*cell)*0.05*noise);
    ctx.fillStyle=BRUISE;
    for(var i=0;i<n;i++){ctx.fillRect(Math.floor(Math.random()*W/cell)*cell,Math.floor(Math.random()*H/cell)*cell,cell,cell);}
    for(var k=0;k<pts.length;k++){
      var p=pts[k],dx=p.x-mouse.x,dy=p.y-mouse.y,d2=dx*dx+dy*dy;
      if(!reduce && d2<4200){var f=(4200-d2)/4200*14;var d=Math.sqrt(d2)||1;p.x+=dx/d*f;p.y+=dy/d*f;}
      p.x+=(p.tx-p.x)*(reduce?1:0.09);p.y+=(p.ty-p.y)*(reduce?1:0.09);
      var flick=p.hot && Math.random()<0.04;
      ctx.fillStyle=flick?LILAC:VIOLET;
      ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,cell-1,cell-1);
    }
    if(!reduce||age<0.1)requestAnimationFrame(frame);
  }
  cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  cv.addEventListener('pointerleave',function(){mouse.x=mouse.y=-999;});
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,120);});
  (document.fonts&&document.fonts.load?document.fonts.load('700 40px "Pixelify Sans"'):Promise.resolve())
    .catch(function(){}).then(function(){build();requestAnimationFrame(frame);});

  /* money ticker: random start, changes every second */
  var START_MIN = 800,  START_MAX = 3000;   // starting value range
  var CHANGE_MIN = 1,   CHANGE_MAX = 180;   // size of each change
  var DOWN_CHANCE = 0.25;                   // how often it drops instead of rises
  var tick=document.getElementById('ticker'),rateEl=document.getElementById('rate');
  var fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
  var total=Math.round((START_MIN+Math.random()*(START_MAX-START_MIN))*100)/100;
  var cols=[],lastStr='';
  function pos(strip,i,animate){
    strip.classList.toggle('snap',!animate);
    strip.style.transform='translateY('+(-i*1.2)+'em)';
    if(!animate){void strip.offsetHeight;strip.classList.remove('snap');}
  }
  function makeCol(d){
    var col=document.createElement('span');col.className='col';col.setAttribute('aria-hidden','true');
    var strip=document.createElement('span');strip.className='strip';
    for(var i=0;i<30;i++){var n=document.createElement('span');n.textContent=i%10;strip.appendChild(n);}
    col.appendChild(strip);
    var c={el:col,strip:strip,val:d,pending:null};
    pos(strip,d+10,false);
    return c;
  }
  function buildTicker(str){
    tick.innerHTML='';cols=[];
    for(var i=0;i<str.length;i++){
      var ch=str[i];
      if(/[0-9]/.test(ch)){var c=makeCol(+ch);cols.push(c);tick.appendChild(c.el);}
      else{var sp=document.createElement('span');sp.className='sym';sp.setAttribute('aria-hidden','true');sp.textContent=ch;tick.appendChild(sp);cols.push(null);}
    }
  }
  function roll(c,to,up){
    if(c.val===to)return;
    if(c.pending){c.strip.removeEventListener('transitionend',c.pending);c.pending=null;pos(c.strip,c.val+10,false);}
    var target = up ? (to>c.val? to+10 : to+20) : (to<c.val? to+10 : to);
    c.val=to;
    pos(c.strip,target,true);
    if(target!==to+10){
      var strip=c.strip;
      c.pending=function(){strip.removeEventListener('transitionend',c.pending);c.pending=null;pos(strip,to+10,false);};
      strip.addEventListener('transitionend',c.pending);
      if(reduce)c.pending();
    }
  }
  function render(up){
    var str=fmt.format(total);
    if(str.length!==lastStr.length){buildTicker(str);}
    else{for(var i=0;i<str.length;i++){if(cols[i])roll(cols[i],+str[i],up);}}
    tick.setAttribute('aria-label',str);lastStr=str;
  }
  function step(){
    var mag=CHANGE_MIN+Math.pow(Math.random(),2)*(CHANGE_MAX-CHANGE_MIN);
    var up=Math.random()>DOWN_CHANCE || total-mag<100;
    var delta=Math.round(mag*100)/100*(up?1:-1);
    total=Math.round((total+delta)*100)/100;
    rateEl.textContent=(up?'+':'-')+fmt.format(Math.abs(delta))+' in the last second';
    render(up);
  }
  render(true);rateEl.textContent='Live';
  setInterval(step,1000);

  /* typed line: erase, then type "Request a key." */
  (function(){
    var link=document.getElementById('typed'),txt=document.getElementById('typed-text');
    var target='Request a key.';
    if(reduce){txt.textContent=target;link.classList.add('live');return;}
    var cur=txt.textContent;
    setTimeout(function erase(){
      if(cur.length){cur=cur.slice(0,-1);txt.textContent=cur;setTimeout(erase,38+Math.random()*30);}
      else{link.classList.add('live');setTimeout(type,450);}
    },2600);
    var i=0;
    function type(){
      if(i<=target.length){txt.textContent=target.slice(0,i++);setTimeout(type,70+Math.random()*90);}
    }
  })();

          var alpha=Math.max(0,1-rr/(Math.max(W,H)*0.8));if(!alpha)continue;
          c.fillStyle='rgba(138,92,255,'+alpha+')';
          var segs=Math.max(24,Math.floor(rr/S/1.5));
          for(i=0;i<segs;i++){var an=i/segs*Math.PI*2;c.fillRect(Math.round((cx+Math.cos(an)*rr)/S)*S,Math.round((cy+Math.sin(an)*rr)/S)*S,S,S);}
        }
        // open keyhole as a glowing slit
        var open=Math.min(1,ft/0.5);
        c.fillStyle='rgba(216,204,255,'+(1-open)+')';
        c.fillRect(cx-S*(1+open*10),cy-S*7,S*2*(1+open*10),S*14);
        for(i=0;i<parts.length;i++){var p=parts[i];
          p.x+=p.vx;p.y+=p.vy;p.vx*=0.965;p.vy*=0.965;p.life-=0.008;
          if(p.life>0){c.globalAlpha=p.life;c.fillStyle=p.col;c.fillRect(Math.round(p.x/S)*S,Math.round(p.y/S)*S,p.s,p.s);}
        }
        c.globalAlpha=1;
        // faint static afterwards
        c.fillStyle='rgba(42,26,74,.8)';
        for(i=0;i<40;i++)c.fillRect(Math.floor(Math.random()*W/S)*S,Math.floor(Math.random()*H/S)*S,S,S);
      }
      raf=requestAnimationFrame(frame);
    }
    function typeInto(el,str,speed,done){var i=0;(function go(){el.textContent=str.slice(0,i++);if(i<=str.length)later(go,speed+Math.random()*speed);else if(done)done();})();}
    function text(){
      msg.classList.add('on');
      typeInto(kick,'Key accepted',45,function(){
        later(function(){typeInto(line,'Request received.',70,function(){
          later(function(){typeInto(sub,"Don't look for us. We'll find you.",40,function(){
            closeBtn.classList.add('on');closeBtn.focus();
          });},350);
        });},250);
      });
    }
    function open(e){
      e.preventDefault();opener=e.currentTarget;
      ov.hidden=false;document.body.style.overflow='hidden';
      kick.textContent=line.textContent=sub.textContent='';msg.classList.remove('on');closeBtn.classList.remove('on');
      setup();
      if(reduce){c.fillStyle='#040308';c.fillRect(0,0,W,H);text();return;}
      t0=performance.now();raf=requestAnimationFrame(frame);
      later(text,3200);
    }
    function close(){
      cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];
      ov.hidden=true;ov.classList.remove('shake');document.body.style.overflow='';
      if(opener)opener.focus();
    }
    document.querySelectorAll('[data-access]').forEach(function(a){a.addEventListener('click',open);});
    closeBtn.addEventListener('click',close);
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.hidden)close();});
    addEventListener('resize',function(){if(!ov.hidden){var p=parts;setup();parts=p;}});
  })();
})();
</script>
</body>
